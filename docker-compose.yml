services:
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: dbs
      POSTGRES_PASSWORD: dbs
      POSTGRES_DB: dbs
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbs -d dbs"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: dbs
      PGPASSWORD: dbs
      PGDATABASE: dbs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
